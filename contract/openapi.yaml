{
  "openapi": "3.1.0",
  "info": {
    "title": "AskFootage API",
    "version": "1.10.0",
    "description": "Ask a plain-English question about fixed-camera footage and get the matching clips with the evidence for each match. Every path is under /api. Every error has the body {\"error\": {\"code\": \"...\", \"message\": \"...\"}} with a matching HTTP status, and never contains a stack trace, a key, a password or a server path. JSON field names are camelCase. Days are calendar dates (YYYY-MM-DD) and times of day are HH:MM:SS in the camera's local time. Cameras are identified by ids the server gives out in order (CAM-001, CAM-002, ...); a camera's stream password is checked when the camera is added and then dropped: it is never stored, returned or logged. Wherever a camera query parameter is optional, leaving it out means all cameras. Lists are not paginated in v1: days, recordings and search results are bounded by the 7-day window and one day; cameras, zones and saved clips are bounded only by what the single user of the v1 demo creates. Versioning: /api is unversioned because the UI and the API ship together; once released, changes are additive only, and a breaking change (such as paging cameras, zones or saved clips) moves to /api/v2. Still pre-release: 1.1.0 added cameras, made camera ids CAM-NNN and dropped the camera from Status; 1.2.0 adds POST /api/recordings/{id}/index; 1.3.0 adds proofs to SearchResponse (measured proof for clips found from stored object tracks); 1.4.0 adds snapshotUrl to Clip and GET /api/clips/{id}/snapshot (the evidence frame, with the matched objects' boxes drawn on it); 1.5.0 makes DELETE /api/cameras/{id} refuse with 409 camera_has_recordings when the camera still has recordings, unless the new query parameter deleteRecordings is true; 1.6.0 adds GET /api/recordings/{id}/boxes (the stored object tracks, so the player can draw the boxes live). 1.7.0 adds POST /api/concepts and GET /api/concepts/{noun} (search the ready recordings for a new object, once, after the user confirms the estimated cost), needsIndexing on SearchResponse and the 409 code budget_exceeded. 1.8.0 adds GET /api/recordings/{id}/poster (a real JPEG still of the footage, cached by the server) and posterUrl on Recording and Clip. 1.9.0 adds hasFootage on Recording (false for a recording that is listed and counted but has no video behind it) and the 404 code footage_not_included on the video, poster and snapshot routes; such a recording has a null posterUrl and is never a search match. 1.10.0 adds POST /api/auth/demo-code (checks a 6-digit demo access code; a UI gate only, no token) and the error codes invalid_demo_code (401) and too_many_attempts (429). This file is written in JSON syntax, which is valid YAML 1.2, so it can be read without a YAML library."
  },
  "paths": {
    "/api/status": {
      "get": {
        "operationId": "getStatus",
        "summary": "Whether the app serves demo data",
        "responses": {
          "200": {
            "description": "Current status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Status"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/auth/demo-code": {
      "post": {
        "summary": "Check a demo access code",
        "description": "A demo gate for the UI only: it does not protect footage and the rest of the API is not authenticated. The code is a 6-digit demo access code kept in the library's database (only a salted hash is stored). No token or cookie is returned: on 200 the UI keeps its own flag. Wrong codes all get the same 401 message, whether the code never existed or was revoked. After 5 wrong codes from one client within a minute (or 50 across all clients), further attempts are refused with 429 (code too_many_attempts, header Retry-After in seconds) until the minute has passed, even for a right code; the counts are in memory and start again when the server restarts. The code is never logged or echoed. Not idempotent by design: each wrong try counts.",
        "operationId": "checkDemoCode",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DemoCodeRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "The code is valid",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DemoCodeAccepted"
                }
              }
            }
          },
          "401": {
            "description": "The code is not valid (code invalid_demo_code, message That code is not valid.)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "A parameter or body field is missing or breaks a rule (code validation_error); the message names the field. A JSON body over 64 KiB is refused with the message body: is too large",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Too many wrong codes from this client, or from all clients together, in the last minute (code too_many_attempts)",
            "headers": {
              "Retry-After": {
                "description": "Seconds to wait before trying again",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Something went wrong on the server (code internal_error); no details are exposed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/cameras": {
      "get": {
        "operationId": "listCameras",
        "summary": "Every camera, in id order (creation order)",
        "responses": {
          "200": {
            "description": "The cameras",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Camera"
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      },
      "post": {
        "operationId": "addCamera",
        "summary": "Add a camera to the registry",
        "description": "The server gives the camera the next id (CAM-001, CAM-002, ...; a number is never reused, even after a delete) and status online. There is no limit on how many cameras can be added. The password is checked for length and then dropped: it is not stored, not returned and not logged. A name that another camera already has, ignoring case, returns 409 with code camera_name_taken.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CameraCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "The new camera",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Camera"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/cameras/{id}": {
      "get": {
        "operationId": "getCamera",
        "summary": "One camera",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "responses": {
          "200": {
            "description": "The camera",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Camera"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      },
      "patch": {
        "operationId": "updateCamera",
        "summary": "Change a camera's status",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CameraUpdate"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The camera after the change",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Camera"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      },
      "delete": {
        "operationId": "deleteCamera",
        "summary": "Delete a camera and everything recorded on it",
        "description": "A camera with no recordings is deleted at once (204), whatever deleteRecordings says; its zones go with it. A camera with one or more recordings is not deleted unless deleteRecordings is true: the answer is 409 with code camera_has_recordings and a message that says how many recordings and saved clips it has, and nothing is changed. With deleteRecordings=true the camera is deleted together with its recordings, their clips, the saved clips and its zones. A second delete of the same camera returns 404. deleteRecordings must be exactly true or false; any other value returns 422.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          },
          {
            "name": "deleteRecordings",
            "in": "query",
            "required": false,
            "description": "True to delete the camera together with its recordings, clips, saved clips and zones; false (the default) refuses when the camera has recordings",
            "schema": {
              "type": "boolean",
              "default": false
            },
            "example": false
          }
        ],
        "responses": {
          "204": {
            "description": "Deleted"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/days": {
      "get": {
        "operationId": "listDays",
        "summary": "Recording counts for the last 7 days, oldest first, ending today",
        "description": "Always returns exactly 7 entries; a day with no footage has recordings 0 and ready 0. Without camera, the counts cover all cameras. The last entry is today on the server's clock (in demo mode, the demo dataset's today), so a client can use it as the default day.",
        "parameters": [
          {
            "$ref": "#/components/parameters/OptionalCameraQuery"
          }
        ],
        "responses": {
          "200": {
            "description": "One entry per day",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/DaySummary"
                  }
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/recordings": {
      "get": {
        "operationId": "listRecordings",
        "summary": "The recordings on one day, earliest first",
        "description": "Without camera, lists every camera's recordings, ordered by startTime, then camera, then id.",
        "parameters": [
          {
            "$ref": "#/components/parameters/DayQuery"
          },
          {
            "$ref": "#/components/parameters/OptionalCameraQuery"
          }
        ],
        "responses": {
          "200": {
            "description": "Recordings ordered by startTime",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Recording"
                  }
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      },
      "post": {
        "operationId": "addRecording",
        "summary": "Upload a video file as a new recording of one camera",
        "description": "Accepts one MP4 file of at most 200 MiB. The recording is registered with status waiting, startTime 00:00:00 and lengthSeconds 0; processing fills those in later. In v1 (demo mode) the file is checked and registered but not stored or processed. Not idempotent: sending the same file again registers another recording.",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": [
                  "file",
                  "day",
                  "camera"
                ],
                "properties": {
                  "file": {
                    "type": "string",
                    "contentMediaType": "video/mp4",
                    "description": "The video, MP4 only, at most 200 MiB"
                  },
                  "day": {
                    "type": "string",
                    "format": "date",
                    "description": "The day the footage was recorded"
                  },
                  "camera": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_-]{1,64}$",
                    "description": "The id of the camera that recorded it, for example CAM-001"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Accepted; the recording now waits to be processed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RecordingAccepted"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "413": {
            "$ref": "#/components/responses/TooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/recordings/{id}/poster": {
      "get": {
        "operationId": "getRecordingPoster",
        "summary": "A poster frame of a recording",
        "description": "One JPEG still, about 640 px wide, taken from the footage at t seconds (default: the middle of the recording) and kept for next time. Returns 404 with the standard error body when the recording is unknown, has no footage attached, is a recording without footage (code footage_not_included), or the frame cannot be made (for example ffmpeg is not installed).",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          },
          {
            "name": "t",
            "in": "query",
            "required": false,
            "description": "Second of the recording to take the poster from; rounded down and kept inside the recording. Left out, the middle of the recording",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 86400
            },
            "example": 12
          }
        ],
        "responses": {
          "200": {
            "description": "The poster",
            "content": {
              "image/jpeg": {
                "schema": {
                  "type": "string",
                  "contentMediaType": "image/jpeg"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/FootageNotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/recordings/{id}/video": {
      "get": {
        "operationId": "getRecordingVideo",
        "summary": "Stream the recording's video",
        "description": "Streams the footage file (in demo mode, videos/clip1.mp4 for every recording that has footage). Supports HTTP Range requests so a player can seek. Returns 404 with the standard error body when the recording is unknown or no footage file is attached, and with code footage_not_included when the recording has none (hasFootage false).",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "responses": {
          "200": {
            "description": "The video",
            "content": {
              "video/mp4": {
                "schema": {
                  "type": "string",
                  "contentMediaType": "video/mp4"
                }
              }
            }
          },
          "206": {
            "description": "Part of the video, for a Range request",
            "content": {
              "video/mp4": {
                "schema": {
                  "type": "string",
                  "contentMediaType": "video/mp4"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/FootageNotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/recordings/{id}/boxes": {
      "get": {
        "operationId": "getRecordingBoxes",
        "summary": "The boxes of the objects found in a recording, frame by frame",
        "description": "The stored object tracks of the recording, for the player to draw boxes over the playing video. Boxes are in pixels of the frameWidth x frameHeight frame; a frame number n is at second n / fps from the start of the recording. A track has a point only on frames where the object was detected. Hands are left out. Short isolated runs of a non-person object (under one second) are treated as detector noise and left out. A recording that is known but has no stored tracks returns an empty tracks list; 404 when the recording is unknown.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "responses": {
          "200": {
            "description": "The boxes",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RecordingBoxes"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/recordings/{id}/index": {
      "post": {
        "operationId": "indexRecording",
        "summary": "Start indexing a recording so it becomes searchable",
        "description": "Only a recording with status waiting can be indexed. On acceptance its status becomes preparing and the work continues after the reply: preparing (making the working copy), then indexing (finding objects), then ready. If the work fails, the status goes back to waiting so it can be retried. No request body. Not idempotent: a second call while the first is still running returns 409. When this build has no indexing backend, the reply is 503 with code indexing_not_configured and nothing changes.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "responses": {
          "202": {
            "description": "Accepted; the recording is now being prepared",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IndexAccepted"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          },
          "503": {
            "$ref": "#/components/responses/IndexingNotConfigured"
          }
        }
      }
    },
    "/api/search": {
      "post": {
        "operationId": "search",
        "summary": "Answer a question about one day of footage, from one camera or all of them",
        "description": "Synchronous in v1. Without camera, every camera's footage is searched. Only ready recordings are searched; note explains anything the answer left out (for example a recording still being indexed), and is null when there is nothing to add. clips is empty when nothing matched.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SearchRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The matching clips, earliest first",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SearchResponse"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/clips/{id}": {
      "get": {
        "operationId": "getClip",
        "summary": "One clip with its evidence",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "responses": {
          "200": {
            "description": "The clip",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Clip"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/clips/{id}/snapshot": {
      "get": {
        "operationId": "getClipSnapshot",
        "summary": "The evidence snapshot of a clip",
        "description": "A JPEG of the frame where the match began, with the object's box drawn in red and the person's box in a neutral grey. Made when a search finds the clip from stored object tracks. Returns 404 with the standard error body when the clip is unknown or has no snapshot, and with code footage_not_included when the clip's recording has no footage (hasFootage false).",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "responses": {
          "200": {
            "description": "The snapshot",
            "content": {
              "image/jpeg": {
                "schema": {
                  "type": "string",
                  "contentMediaType": "image/jpeg"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/FootageNotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/zones": {
      "get": {
        "operationId": "listZones",
        "summary": "All zones, or only one camera's, ordered by name",
        "parameters": [
          {
            "$ref": "#/components/parameters/OptionalCameraQuery"
          }
        ],
        "responses": {
          "200": {
            "description": "The zones",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Zone"
                  }
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      },
      "post": {
        "operationId": "createZone",
        "summary": "Draw a new zone on a camera's view",
        "description": "Zone names are unique per camera, ignoring case; sending the same request again returns 409 with code zone_name_taken.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ZoneCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "The new zone",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Zone"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "422": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "500": {
            "$ref": "#/components/responses/ServerError"
          }
        }
      }
    },
    "/api/zones/{id}": {
      "put": {
        "operationId": "replaceZone",
        "summary": "Rename or redraw a zone",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdPath"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ZoneUpdate"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The zone after the change",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Zone"
                }
              }
            }
          },
          "404": {
