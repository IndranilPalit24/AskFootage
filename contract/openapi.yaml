{
  "openapi": "3.1.0",
  "info": {
    "title": "AskFootage API",
    "version": "1.4.0",
    "description": "Ask a plain-English question about fixed-camera footage and get the matching clips with the evidence for each match. Every path is under /api. Every error has the body {\"error\": {\"code\": \"...\", \"message\": \"...\"}} with a matching HTTP status, and never contains a stack trace, a key, a password or a server path. JSON field names are camelCase. Days are calendar dates (YYYY-MM-DD) and times of day are HH:MM:SS in the camera's local time. Cameras are identified by ids the server gives out in order (CAM-001, CAM-002, ...); a camera's stream password is checked when the camera is added and then dropped: it is never stored, returned or logged. Wherever a camera query parameter is optional, leaving it out means all cameras. Lists are not paginated in v1: days, recordings and search results are bounded by the 7-day window and one day; cameras, zones and saved clips are bounded only by what the single user of the v1 demo creates. Versioning: /api is unversioned because the UI and the API ship together; once released, changes are additive only, and a breaking change (such as paging cameras, zones or saved clips) moves to /api/v2. Still pre-release: 1.1.0 added cameras, made camera ids CAM-NNN and dropped the camera from Status; 1.2.0 adds POST /api/recordings/{id}/index; 1.3.0 adds proofs to SearchResponse (measured proof for clips found from stored object tracks); 1.4.0 adds snapshotUrl to Clip and GET /api/clips/{id}/snapshot (the evidence frame, with the matched objects' boxes drawn on it). This file is written in JSON syntax, which is valid YAML 1.2, so it can be read without a YAML library."
  },
  "paths": {
    "/api/status": {
      "get": {
        "operationId": "getStatus",
        "summary": "Whether the app serves demo data",
        "responses": {
          "200": {
            "description": "Current status",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Status" } } }
          },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/cameras": {
      "get": {
        "operationId": "listCameras",
        "summary": "Every camera, in id order (creation order)",
        "responses": {
          "200": {
            "description": "The cameras",
            "content": {
              "application/json": {
                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/Camera" } }
              }
            }
          },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "post": {
        "operationId": "addCamera",
        "summary": "Add a camera to the registry",
        "description": "The server gives the camera the next id (CAM-001, CAM-002, ...; a number is never reused, even after a delete) and status online. There is no limit on how many cameras can be added. The password is checked for length and then dropped: it is not stored, not returned and not logged. A name that another camera already has, ignoring case, returns 409 with code camera_name_taken.",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CameraCreate" } } }
        },
        "responses": {
          "201": {
            "description": "The new camera",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Camera" } } }
          },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/cameras/{id}": {
      "get": {
        "operationId": "getCamera",
        "summary": "One camera",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "200": {
            "description": "The camera",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Camera" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "patch": {
        "operationId": "updateCamera",
        "summary": "Change a camera's status",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CameraUpdate" } } }
        },
        "responses": {
          "200": {
            "description": "The camera after the change",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Camera" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "delete": {
        "operationId": "deleteCamera",
        "summary": "Delete a camera and everything recorded on it",
        "description": "Also removes the camera's recordings (with their clips and saved clips) and its zones. A second delete of the same camera returns 404.",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "204": { "description": "Deleted" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/days": {
      "get": {
        "operationId": "listDays",
        "summary": "Recording counts for the last 7 days, oldest first, ending today",
        "description": "Always returns exactly 7 entries; a day with no footage has recordings 0 and ready 0. Without camera, the counts cover all cameras. The last entry is today on the server's clock (in demo mode, the demo dataset's today), so a client can use it as the default day.",
        "parameters": [{ "$ref": "#/components/parameters/OptionalCameraQuery" }],
        "responses": {
          "200": {
            "description": "One entry per day",
            "content": {
              "application/json": {
                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/DaySummary" } }
              }
            }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/recordings": {
      "get": {
        "operationId": "listRecordings",
        "summary": "The recordings on one day, earliest first",
        "description": "Without camera, lists every camera's recordings, ordered by startTime, then camera, then id.",
        "parameters": [
          { "$ref": "#/components/parameters/DayQuery" },
          { "$ref": "#/components/parameters/OptionalCameraQuery" }
        ],
        "responses": {
          "200": {
            "description": "Recordings ordered by startTime",
            "content": {
              "application/json": {
                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/Recording" } }
              }
            }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "post": {
        "operationId": "addRecording",
        "summary": "Upload a video file as a new recording of one camera",
        "description": "Accepts one MP4 file of at most 200 MiB. The recording is registered with status waiting, startTime 00:00:00 and lengthSeconds 0; processing fills those in later. In v1 (demo mode) the file is checked and registered but not stored or processed. Not idempotent: sending the same file again registers another recording.",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": ["file", "day", "camera"],
                "properties": {
                  "file": { "type": "string", "contentMediaType": "video/mp4", "description": "The video, MP4 only, at most 200 MiB" },
                  "day": { "type": "string", "format": "date", "description": "The day the footage was recorded" },
                  "camera": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$", "description": "The id of the camera that recorded it, for example CAM-001" }
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Accepted; the recording now waits to be processed",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RecordingAccepted" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "413": { "$ref": "#/components/responses/TooLarge" },
          "415": { "$ref": "#/components/responses/UnsupportedMediaType" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/recordings/{id}/video": {
      "get": {
        "operationId": "getRecordingVideo",
        "summary": "Stream the recording's video",
        "description": "Streams the footage file (in demo mode, videos/clip1.mp4 for every recording). Supports HTTP Range requests so a player can seek. Returns 404 with the standard error body when the recording is unknown or no footage file is attached.",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "200": {
            "description": "The video",
            "content": { "video/mp4": { "schema": { "type": "string", "contentMediaType": "video/mp4" } } }
          },
          "206": {
            "description": "Part of the video, for a Range request",
            "content": { "video/mp4": { "schema": { "type": "string", "contentMediaType": "video/mp4" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/recordings/{id}/index": {
      "post": {
        "operationId": "indexRecording",
        "summary": "Start indexing a recording so it becomes searchable",
        "description": "Only a recording with status waiting can be indexed. On acceptance its status becomes preparing and the work continues after the reply: preparing (making the working copy), then indexing (finding objects), then ready. If the work fails, the status goes back to waiting so it can be retried. No request body. Not idempotent: a second call while the first is still running returns 409. When this build has no indexing backend, the reply is 503 with code indexing_not_configured and nothing changes.",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "202": {
            "description": "Accepted; the recording is now being prepared",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IndexAccepted" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" },
          "503": { "$ref": "#/components/responses/IndexingNotConfigured" }
        }
      }
    },
    "/api/search": {
      "post": {
        "operationId": "search",
        "summary": "Answer a question about one day of footage, from one camera or all of them",
        "description": "Synchronous in v1. Without camera, every camera's footage is searched. Only ready recordings are searched; note explains anything the answer left out (for example a recording still being indexed), and is null when there is nothing to add. clips is empty when nothing matched.",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SearchRequest" } } }
        },
        "responses": {
          "200": {
            "description": "The matching clips, earliest first",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SearchResponse" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/clips/{id}": {
      "get": {
        "operationId": "getClip",
        "summary": "One clip with its evidence",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "200": {
            "description": "The clip",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Clip" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/clips/{id}/snapshot": {
      "get": {
        "operationId": "getClipSnapshot",
        "summary": "The evidence snapshot of a clip",
        "description": "A JPEG of the frame where the match began, with the object's box drawn in red and the person's box in a neutral grey. Made when a search finds the clip from stored object tracks. Returns 404 with the standard error body when the clip is unknown or has no snapshot.",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "200": {
            "description": "The snapshot",
            "content": { "image/jpeg": { "schema": { "type": "string", "contentMediaType": "image/jpeg" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/zones": {
      "get": {
        "operationId": "listZones",
        "summary": "All zones, or only one camera's, ordered by name",
        "parameters": [{ "$ref": "#/components/parameters/OptionalCameraQuery" }],
        "responses": {
          "200": {
            "description": "The zones",
            "content": {
              "application/json": {
                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/Zone" } }
              }
            }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "post": {
        "operationId": "createZone",
        "summary": "Draw a new zone on a camera's view",
        "description": "Zone names are unique per camera, ignoring case; sending the same request again returns 409 with code zone_name_taken.",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ZoneCreate" } } }
        },
        "responses": {
          "201": {
            "description": "The new zone",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Zone" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/zones/{id}": {
      "put": {
        "operationId": "replaceZone",
        "summary": "Rename or redraw a zone",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ZoneUpdate" } } }
        },
        "responses": {
          "200": {
            "description": "The zone after the change",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Zone" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "delete": {
        "operationId": "deleteZone",
        "summary": "Delete a zone",
        "description": "A second delete of the same zone returns 404.",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "204": { "description": "Deleted" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/saved-clips": {
      "get": {
        "operationId": "listSavedClips",
        "summary": "Saved clips, newest save first, optionally only those from one day",
        "parameters": [{ "$ref": "#/components/parameters/OptionalDayQuery" }],
        "responses": {
          "200": {
            "description": "The saved clips",
            "content": {
              "application/json": {
                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/SavedClip" } }
              }
            }
          },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "post": {
        "operationId": "saveClip",
        "summary": "Save a clip with a note",
        "description": "A clip can be saved once; saving it again returns 409 with code already_saved.",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SavedClipCreate" } } }
        },
        "responses": {
          "201": {
            "description": "The saved clip",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SavedClip" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    },
    "/api/saved-clips/{id}": {
      "patch": {
        "operationId": "updateSavedClip",
        "summary": "Change a saved clip's note",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SavedClipUpdate" } } }
        },
        "responses": {
          "200": {
            "description": "The saved clip after the change",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SavedClip" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      },
      "delete": {
        "operationId": "deleteSavedClip",
        "summary": "Remove a clip from the saved list",
        "description": "The clip itself stays. A second delete of the same saved clip returns 404.",
        "parameters": [{ "$ref": "#/components/parameters/IdPath" }],
        "responses": {
          "204": { "description": "Removed" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/ValidationFailed" },
          "500": { "$ref": "#/components/responses/ServerError" }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "IdPath": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" }
      },
      "OptionalCameraQuery": {
        "name": "camera",
        "in": "query",
        "required": false,
        "description": "A camera id; leave it out for all cameras",
        "schema": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
        "example": "CAM-001"
      },
      "DayQuery": {
        "name": "day",
        "in": "query",
        "required": true,
        "schema": { "type": "string", "format": "date" },
        "example": "2026-10-29"
      },
      "OptionalDayQuery": {
        "name": "day",
        "in": "query",
        "required": false,
        "schema": { "type": "string", "format": "date" },
        "example": "2026-10-29"
      }
    },
    "responses": {
      "NotFound": {
        "description": "No such camera, recording, clip, zone or saved clip, or no footage file (code not_found)",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "Conflict": {
        "description": "The change clashes with existing data (code already_saved, zone_name_taken or camera_name_taken), or the recording is not waiting to be indexed (code recording_not_waiting)",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "TooLarge": {
        "description": "The upload is over 200 MiB (code file_too_large)",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "UnsupportedMediaType": {
        "description": "The upload is not an MP4 video (code unsupported_media_type)",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "ValidationFailed": {
        "description": "A parameter or body field is missing or breaks a rule (code validation_error); the message names the field. A JSON body over 64 KiB is refused with the message body: is too large",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "ServerError": {
        "description": "Something went wrong on the server (code internal_error); no details are exposed",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      },
      "IndexingNotConfigured": {
        "description": "This build has no indexing backend (code indexing_not_configured, message Indexing is not configured in this build)",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } }
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": ["error"],
        "properties": { "error": { "$ref": "#/components/schemas/ErrorDetail" } }
      },
      "ErrorDetail": {
        "type": "object",
        "required": ["code", "message"],
        "properties": {
          "code": {
            "type": "string",
            "description": "Stable, machine-readable: validation_error, not_found, method_not_allowed (405, also a refused CORS preflight), already_saved, zone_name_taken, camera_name_taken, file_too_large, unsupported_media_type or internal_error"
          },
          "message": { "type": "string", "description": "Plain-English explanation, safe to show to a person; never contains a submitted password" }
        }
      },
      "Status": {
        "type": "object",
        "required": ["demoMode"],
        "properties": {
          "demoMode": { "type": "boolean", "description": "True when the app serves the seeded demo data" }
        }
      },
      "Camera": {
        "type": "object",
        "required": [
          "id", "name", "location", "department", "ip", "status", "rtspUrlMasked",
          "zoneCount", "recordingCount", "savedClipCount", "createdAt"
        ],
        "properties": {
          "id": { "type": "string", "pattern": "^CAM-[0-9]{3,}$", "description": "Given by the server in order: CAM-001, CAM-002, ... (CAM-1000 after CAM-999); never reused, even after a delete" },
          "name": { "type": "string", "minLength": 1, "maxLength": 80 },
          "location": { "type": ["string", "null"], "description": "Where the camera is, or null" },
          "department": { "type": ["string", "null"], "description": "Who looks after it, or null" },
          "ip": { "type": "string", "description": "IPv4 address or host name of the camera" },
          "status": { "type": "string", "enum": ["online", "standby", "offline"], "description": "online: streaming; standby: reachable but not recording; offline: not reachable" },
          "rtspUrlMasked": { "type": "string", "description": "rtsp://<username>:****@<ip>:554/cam/realmonitor?channel=1&subtype=1, where <username> is the stream username percent-encoded (every character except A-Z a-z 0-9 - . _ ~ becomes %XX of its UTF-8 bytes, upper-case hex) and the password is always the four characters ****. The real password is never part of any response." },
          "zoneCount": { "type": "integer", "minimum": 0 },
          "recordingCount": { "type": "integer", "minimum": 0 },
          "savedClipCount": { "type": "integer", "minimum": 0, "description": "Saved clips from this camera's recordings" },
          "createdAt": { "type": "string", "format": "date-time", "description": "UTC, ending in Z" }
        }
      },
      "CameraCreate": {
        "type": "object",
        "required": ["name", "ip", "username", "password", "acknowledgeCost"],
        "properties": {
          "name": { "type": "string", "minLength": 1, "maxLength": 80, "description": "Not blank after trimming (stored trimmed); unique ignoring case (409 camera_name_taken)" },
          "ip": { "type": "string", "minLength": 1, "maxLength": 253, "pattern": "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$", "description": "An IPv4 address (four numbers 0-255 separated by dots) or a host name (labels of letters, digits and inner hyphens separated by dots). No spaces, scheme, port, user or path. A value made only of digits and dots must be a valid IPv4 address." },
          "username": { "type": "string", "minLength": 1, "maxLength": 64, "description": "The stream username; shown inside rtspUrlMasked" },
          "password": { "type": "string", "minLength": 1, "maxLength": 128, "writeOnly": true, "description": "The stream password. Checked for length, then dropped: never stored, returned or logged" },
          "location": { "type": ["string", "null"], "maxLength": 80, "default": null, "description": "Optional; blank after trimming means null" },
          "department": { "type": ["string", "null"], "maxLength": 80, "default": null, "description": "Optional; blank after trimming means null" },
          "acknowledgeCost": { "type": "boolean", "const": true, "description": "Must be true: the user accepts that searching footage uses their Meta credits" }
        }
      },
      "CameraUpdate": {
        "type": "object",
        "required": ["status"],
        "properties": {
          "status": { "type": "string", "enum": ["online", "standby", "offline"] }
        }
      },
      "DaySummary": {
        "type": "object",
        "required": ["day", "recordings", "ready"],
        "properties": {
          "day": { "type": "string", "format": "date" },
          "recordings": { "type": "integer", "minimum": 0, "description": "Recordings made on this day" },
          "ready": { "type": "integer", "minimum": 0, "description": "Of those, how many can be searched" }
        }
      },
      "Recording": {
        "type": "object",
        "required": ["id", "camera", "day", "startTime", "lengthSeconds", "status"],
        "properties": {
          "id": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "camera": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$", "description": "The id of the camera that made it" },
          "day": { "type": "string", "format": "date" },
          "startTime": { "type": "string", "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$", "description": "Time of day the recording starts" },
          "lengthSeconds": { "type": "integer", "minimum": 0 },
          "status": {
            "type": "string",
            "enum": ["waiting", "preparing", "indexing", "ready"],
            "description": "waiting: not started; preparing: making the working copy; indexing: finding objects; ready: searchable"
          }
        }
      },
      "RecordingAccepted": {
        "type": "object",
        "required": ["id", "status"],
        "properties": {
          "id": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "status": { "type": "string", "enum": ["waiting"] }
        }
      },
      "IndexAccepted": {
        "type": "object",
        "required": ["id", "status"],
        "properties": {
          "id": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "status": { "type": "string", "enum": ["preparing"] }
        }
      },
      "Evidence": {
        "type": "object",
        "required": ["kind", "text"],
        "properties": {
          "kind": { "type": "string", "enum": ["carrying", "in_zone", "dwell"] },
          "text": { "type": "string", "description": "Short chip text, for example Carrying · 16 s" }
        }
      },
      "KeyFrame": {
        "type": "object",
        "required": ["atSeconds", "imageUrl"],
        "properties": {
          "atSeconds": { "type": "integer", "minimum": 0, "description": "Seconds from the start of the recording" },
          "imageUrl": { "type": ["string", "null"], "description": "Still image of the frame, or null when none was made" }
        }
      },
      "Clip": {
        "type": "object",
        "required": [
          "id", "recordingId", "camera", "day", "startTime", "startSeconds", "endSeconds", "label",
          "evidence", "zone", "whyMatched", "keyFrames", "thumbnailUrl", "snapshotUrl"
        ],
        "properties": {
          "id": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "recordingId": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "camera": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$", "description": "The id of the camera that made the recording" },
          "day": { "type": "string", "format": "date" },
          "startTime": { "type": "string", "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$", "description": "Time of day the clip starts" },
          "startSeconds": { "type": "integer", "minimum": 0, "description": "Seconds from the start of the recording" },
          "endSeconds": { "type": "integer", "minimum": 1, "description": "Seconds from the start of the recording; greater than startSeconds" },
          "label": { "type": "string", "description": "One line, neutral words only, for example Person carrying a box through the loading dock" },
          "evidence": { "type": "array", "items": { "$ref": "#/components/schemas/Evidence" } },
          "zone": { "type": ["string", "null"], "description": "Name of the zone involved, or null" },
          "whyMatched": { "type": "string", "description": "Two or three plain sentences explaining the match" },
          "keyFrames": { "type": "array", "items": { "$ref": "#/components/schemas/KeyFrame" } },
          "thumbnailUrl": { "type": ["string", "null"] },
          "snapshotUrl": { "type": ["string", "null"], "description": "URL of the evidence snapshot (GET /api/clips/{id}/snapshot), or null when none was made. Only clips found from stored object tracks can have one." }
        }
      },
      "SearchRequest": {
        "type": "object",
        "required": ["question", "day"],
        "properties": {
          "question": { "type": "string", "minLength": 1, "maxLength": 300, "description": "Not blank after trimming" },
          "day": { "type": "string", "format": "date" },
          "camera": { "type": ["string", "null"], "pattern": "^[A-Za-z0-9_-]{1,64}$", "default": null, "description": "A camera id; null or left out searches every camera" }
        }
      },
      "SearchResponse": {
        "type": "object",
        "required": ["question", "day", "clips", "note", "proofs"],
        "properties": {
          "question": { "type": "string", "description": "The question as received, trimmed" },
          "day": { "type": "string", "format": "date" },
          "clips": { "type": "array", "items": { "$ref": "#/components/schemas/Clip" } },
          "note": { "type": ["string", "null"], "description": "What the answer left out and why, or null" },
          "proofs": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/ClipProof" },
            "description": "Measured proof for clips found from stored object tracks, one per such clip; empty when every clip came from the demo keyword search"
          }
        }
      },
      "ProofMeasure": {
        "type": "object",
        "required": ["name", "value"],
        "properties": {
          "name": { "type": "string", "description": "For example frames_together, motion_agreement, frames_inside or coverage" },
          "value": { "type": "number" }
        }
      },
      "ProofBox": {
        "type": "object",
        "required": ["frame", "trackId", "label", "x1", "y1", "x2", "y2"],
        "properties": {
          "frame": { "type": "integer", "minimum": 0 },
          "trackId": { "type": "integer", "minimum": 0 },
          "label": { "type": "string", "description": "A neutral object noun, such as person or cardboard box" },
          "x1": { "type": "number" },
          "y1": { "type": "number" },
          "x2": { "type": "number" },
          "y2": { "type": "number" }
        }
      },
      "ClipProof": {
        "type": "object",
        "required": [
          "clipId", "relation", "startFrame", "endFrame", "startSeconds", "endSeconds",
          "trackIds", "trackLabels", "measures", "boxes"
        ],
        "properties": {
          "clipId": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$", "description": "The clip in clips this proves" },
          "relation": { "type": "string", "enum": ["carrying", "in_zone", "dwell"] },
          "startFrame": { "type": "integer", "minimum": 0 },
          "endFrame": { "type": "integer", "minimum": 0, "description": "Inclusive" },
          "startSeconds": { "type": "number", "minimum": 0, "description": "Seconds from the start of the recording" },
          "endSeconds": { "type": "number", "minimum": 0, "description": "End of the last frame, in the same unit" },
          "trackIds": { "type": "array", "items": { "type": "integer" }, "description": "Track ids used, such as [person, box]" },
          "trackLabels": { "type": "array", "items": { "type": "string" }, "description": "The label of each track, in the same order" },
          "measures": { "type": "array", "items": { "$ref": "#/components/schemas/ProofMeasure" } },
          "boxes": { "type": "array", "items": { "$ref": "#/components/schemas/ProofBox" }, "description": "First, middle and last box of each track" }
        }
      },
      "Point": {
        "type": "array",
        "description": "[x, y] as fractions of the frame's width and height, from the top-left corner",
        "minItems": 2,
        "maxItems": 2,
        "items": { "type": "number", "minimum": 0, "maximum": 1 }
      },
      "Zone": {
        "type": "object",
        "required": ["id", "camera", "name", "points"],
        "properties": {
          "id": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "camera": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$", "description": "The id of the camera the zone is drawn on" },
          "name": { "type": "string", "minLength": 1, "maxLength": 60 },
          "points": { "type": "array", "minItems": 3, "maxItems": 50, "items": { "$ref": "#/components/schemas/Point" } }
        }
      },
      "ZoneCreate": {
        "type": "object",
        "required": ["camera", "name", "points"],
        "properties": {
          "camera": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$", "description": "The id of the camera to draw on (404 if unknown)" },
          "name": { "type": "string", "minLength": 1, "maxLength": 60, "description": "Not blank after trimming; unique per camera, ignoring case (409 zone_name_taken)" },
          "points": { "type": "array", "minItems": 3, "maxItems": 50, "items": { "$ref": "#/components/schemas/Point" } }
        }
      },
      "ZoneUpdate": {
        "type": "object",
        "required": ["name", "points"],
        "properties": {
          "name": { "type": "string", "minLength": 1, "maxLength": 60, "description": "Not blank after trimming; unique per camera, ignoring case (409 zone_name_taken); a zone may change the case of its own name" },
          "points": { "type": "array", "minItems": 3, "maxItems": 50, "items": { "$ref": "#/components/schemas/Point" } }
        }
      },
      "SavedClip": {
        "type": "object",
        "required": ["id", "clip", "note", "savedAt"],
        "properties": {
          "id": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "clip": { "$ref": "#/components/schemas/Clip" },
          "note": { "type": "string", "maxLength": 500 },
          "savedAt": { "type": "string", "format": "date-time", "description": "UTC, ending in Z" }
        }
      },
      "SavedClipCreate": {
        "type": "object",
        "required": ["clipId"],
        "properties": {
          "clipId": { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$" },
          "note": { "type": "string", "maxLength": 500, "default": "" }
        }
      },
      "SavedClipUpdate": {
        "type": "object",
        "required": ["note"],
        "properties": {
          "note": { "type": "string", "maxLength": 500 }
        }
      }
    }
  }
}
