          }
        }
      }
    },
    "/api/concepts": {
      "post": {
        "summary": "Search the recordings that lack a new object, once",
        "description": "Queues ONE pass for the noun over the ready recordings that have no stored tracks for it (the recordings of day and camera, or the 7 days ending today). Searching for a new object spends only after the user confirms: confirm must be exactly true. (Indexing a whole recording with POST /api/recordings/{id}/index is also capped by the spending limit; it answers 503 in builds without perception.) The estimate is the sum over the recordings of 0.20 dollars per 1,000 frames at 5 frames per second, at least 50 frames per recording; if the spending cap could not pay for it (with the passes already waiting counted) the answer is 409 budget_exceeded and nothing starts. Idempotent per noun: while a pass for the noun is queued or running, asking again returns that pass with 200 and starts nothing; so does asking when no recording lacks the noun (state done, no recordings). A failed pass can be asked for again. Poll GET /api/concepts/{noun}; when it is done, search again. Without a key the pass replays saved results and spends nothing; a noun with no saved result fails with a fixed message. A build that cannot search for new objects answers 503.",
        "operationId": "requestConcept",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConceptRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "description": "Accepted; the pass is queued and runs after the reply",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConceptJob"
                }
              }
            }
          },
          "200": {
            "description": "The pass that already exists (nothing new started)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConceptJob"
                }
              }
            }
          },
          "409": {
            "description": "The change clashes with existing data (code already_saved, zone_name_taken or camera_name_taken), the camera still has recordings and deleteRecordings was not true (code camera_has_recordings), the recording is not waiting to be indexed (code recording_not_waiting), or the spending cap could not pay for a pass over a new object (code budget_exceeded)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "A parameter or body field is missing or breaks a rule (code validation_error); the message names the field. A JSON body over 64 KiB is refused with the message body: is too large",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Something went wrong on the server (code internal_error); no details are exposed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "This build has no indexing backend (code indexing_not_configured, message Indexing is not configured in this build)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/concepts/{noun}": {
      "get": {
        "summary": "Where the pass for an object is",
        "description": "The state of the latest pass asked for this object since the server started, for polling. 404 when none was asked for; 503 when this build cannot search for new objects.",
        "operationId": "getConcept",
        "parameters": [
          {
            "name": "noun",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 40,
              "description": "The object in plain English, such as forklift (URL-encode spaces)",
              "examples": [
                "forklift"
              ],
              "title": "Noun"
            },
            "description": "The object in plain English, such as forklift (URL-encode spaces)"
          }
        ],
        "responses": {
          "200": {
            "description": "The pass for the object",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConceptJob"
                }
              }
            }
          },
          "404": {
            "description": "No such camera, recording, clip, zone, saved clip or requested object pass, or no footage file (code not_found)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "A parameter or body field is missing or breaks a rule (code validation_error); the message names the field. A JSON body over 64 KiB is refused with the message body: is too large",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Something went wrong on the server (code internal_error); no details are exposed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "This build has no indexing backend (code indexing_not_configured, message Indexing is not configured in this build)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "IdPath": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{1,64}$"
        }
      },
      "OptionalCameraQuery": {
        "name": "camera",
        "in": "query",
        "required": false,
        "description": "A camera id; leave it out for all cameras",
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9_-]{1,64}$"
        },
        "example": "CAM-001"
      },
      "DayQuery": {
        "name": "day",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string",
          "format": "date"
        },
        "example": "2026-10-29"
      },
      "OptionalDayQuery": {
        "name": "day",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "format": "date"
        },
        "example": "2026-10-29"
      }
    },
    "responses": {
      "NotFound": {
        "description": "No such camera, recording, clip, zone or saved clip, or no footage file (code not_found)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "FootageNotFound": {
        "description": "No such recording or clip, no footage file or snapshot (code not_found), or the recording is listed but has no video behind it (code footage_not_included)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Conflict": {
        "description": "The change clashes with existing data (code already_saved, zone_name_taken or camera_name_taken), the camera still has recordings and deleteRecordings was not true (code camera_has_recordings), or the recording is not waiting to be indexed (code recording_not_waiting)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "TooLarge": {
        "description": "The upload is over 200 MiB (code file_too_large)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "UnsupportedMediaType": {
        "description": "The upload is not an MP4 video (code unsupported_media_type)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "ValidationFailed": {
        "description": "A parameter or body field is missing or breaks a rule (code validation_error); the message names the field. A JSON body over 64 KiB is refused with the message body: is too large",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "ServerError": {
        "description": "Something went wrong on the server (code internal_error); no details are exposed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "IndexingNotConfigured": {
        "description": "This build has no indexing backend (code indexing_not_configured, message Indexing is not configured in this build)",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "$ref": "#/components/schemas/ErrorDetail"
          }
        }
      },
      "ErrorDetail": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string",
            "description": "Stable, machine-readable: validation_error, not_found, method_not_allowed (405, also a refused CORS preflight), already_saved, zone_name_taken, camera_name_taken, camera_has_recordings, recording_not_waiting, budget_exceeded, footage_not_included (404), file_too_large, unsupported_media_type, indexing_not_configured or internal_error"
          },
          "message": {
            "type": "string",
            "description": "Plain-English explanation, safe to show to a person; never contains a submitted password"
          }
        }
      },
      "Status": {
        "type": "object",
        "required": [
          "demoMode"
        ],
        "properties": {
          "demoMode": {
            "type": "boolean",
            "description": "True when the app serves the seeded demo data"
          }
        }
      },
      "Camera": {
        "type": "object",
        "required": [
          "id",
          "name",
          "location",
          "department",
          "ip",
          "status",
          "rtspUrlMasked",
          "zoneCount",
          "recordingCount",
          "savedClipCount",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^CAM-[0-9]{3,}$",
            "description": "Given by the server in order: CAM-001, CAM-002, ... (CAM-1000 after CAM-999); never reused, even after a delete"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "location": {
            "type": [
              "string",
              "null"
            ],
            "description": "Where the camera is, or null"
          },
          "department": {
            "type": [
              "string",
              "null"
            ],
            "description": "Who looks after it, or null"
          },
          "ip": {
            "type": "string",
            "description": "IPv4 address or host name of the camera"
          },
          "status": {
            "type": "string",
            "enum": [
              "online",
              "standby",
              "offline"
            ],
            "description": "online: streaming; standby: reachable but not recording; offline: not reachable"
          },
          "rtspUrlMasked": {
            "type": "string",
            "description": "rtsp://<username>:****@<ip>:554/cam/realmonitor?channel=1&subtype=1, where <username> is the stream username percent-encoded (every character except A-Z a-z 0-9 - . _ ~ becomes %XX of its UTF-8 bytes, upper-case hex) and the password is always the four characters ****. The real password is never part of any response."
          },
          "zoneCount": {
            "type": "integer",
            "minimum": 0
          },
          "recordingCount": {
            "type": "integer",
            "minimum": 0
          },
          "savedClipCount": {
            "type": "integer",
            "minimum": 0,
            "description": "Saved clips from this camera's recordings"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "description": "UTC, ending in Z"
          }
        }
      },
      "CameraCreate": {
        "type": "object",
        "required": [
          "name",
          "ip",
          "username",
          "password",
          "acknowledgeCost"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80,
            "description": "Not blank after trimming (stored trimmed); unique ignoring case (409 camera_name_taken)"
          },
          "ip": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253,
            "pattern": "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$",
            "description": "An IPv4 address (four numbers 0-255 separated by dots) or a host name (labels of letters, digits and inner hyphens separated by dots). No spaces, scheme, port, user or path. A value made only of digits and dots must be a valid IPv4 address."
          },
          "username": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "description": "The stream username; shown inside rtspUrlMasked"
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "writeOnly": true,
            "description": "The stream password. Checked for length, then dropped: never stored, returned or logged"
          },
          "location": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 80,
            "default": null,
            "description": "Optional; blank after trimming means null"
          },
          "department": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 80,
            "default": null,
            "description": "Optional; blank after trimming means null"
          },
          "acknowledgeCost": {
            "type": "boolean",
            "const": true,
            "description": "Must be true: the user accepts that searching footage uses their Meta credits"
          }
        }
      },
      "CameraUpdate": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "online",
              "standby",
              "offline"
            ]
          }
        }
      },
      "DaySummary": {
        "type": "object",
        "required": [
          "day",
          "recordings",
          "ready"
        ],
        "properties": {
          "day": {
            "type": "string",
            "format": "date"
          },
          "recordings": {
            "type": "integer",
            "minimum": 0,
            "description": "Recordings made on this day"
          },
          "ready": {
            "type": "integer",
            "minimum": 0,
            "description": "Of those, how many can be searched"
          }
        }
      },
      "Recording": {
        "type": "object",
        "required": [
          "id",
          "camera",
          "day",
          "startTime",
          "lengthSeconds",
          "status",
          "posterUrl",
          "hasFootage"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "camera": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$",
            "description": "The id of the camera that made it"
          },
          "day": {
            "type": "string",
            "format": "date"
          },
          "startTime": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$",
            "description": "Time of day the recording starts"
          },
          "lengthSeconds": {
            "type": "integer",
            "minimum": 0
          },
          "status": {
            "type": "string",
            "enum": [
              "waiting",
              "preparing",
              "indexing",
              "ready"
            ],
            "description": "waiting: not started; preparing: making the working copy; indexing: finding objects; ready: searchable"
          },
          "posterUrl": {
            "type": [
              "string",
              "null"
            ],
            "description": "URL of a poster frame from the middle of the recording (GET /api/recordings/{id}/poster), or null when no footage is attached"
          },
          "hasFootage": {
            "type": "boolean",
            "description": "False when the recording is listed and counted but has no video behind it: its video, poster and snapshot routes answer 404 footage_not_included, and it is never a search match"
          }
        }
      },
      "RecordingAccepted": {
        "type": "object",
        "required": [
          "id",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "status": {
            "type": "string",
            "enum": [
              "waiting"
            ]
          }
        }
      },
      "IndexAccepted": {
        "type": "object",
        "required": [
          "id",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "status": {
            "type": "string",
            "enum": [
              "preparing"
            ]
          }
        }
      },
      "Evidence": {
        "type": "object",
        "required": [
          "kind",
          "text"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "carrying",
              "in_zone",
              "dwell"
            ]
          },
          "text": {
            "type": "string",
            "description": "Short chip text, for example Carrying · 16 s"
          }
        }
      },
      "KeyFrame": {
        "type": "object",
        "required": [
          "atSeconds",
          "imageUrl"
        ],
        "properties": {
          "atSeconds": {
            "type": "integer",
            "minimum": 0,
            "description": "Seconds from the start of the recording"
          },
          "imageUrl": {
            "type": [
              "string",
              "null"
            ],
            "description": "Still image of the frame, or null when none was made"
          }
        }
      },
      "Clip": {
        "type": "object",
        "required": [
          "id",
          "recordingId",
          "camera",
          "day",
          "startTime",
          "startSeconds",
          "endSeconds",
          "label",
          "evidence",
          "zone",
          "whyMatched",
          "keyFrames",
          "thumbnailUrl",
          "snapshotUrl",
          "posterUrl"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "recordingId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "camera": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$",
            "description": "The id of the camera that made the recording"
          },
          "day": {
            "type": "string",
            "format": "date"
          },
          "startTime": {
            "type": "string",
            "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$",
            "description": "Time of day the clip starts"
          },
          "startSeconds": {
            "type": "integer",
            "minimum": 0,
            "description": "Seconds from the start of the recording"
          },
          "endSeconds": {
            "type": "integer",
            "minimum": 1,
            "description": "Seconds from the start of the recording; greater than startSeconds"
          },
          "label": {
            "type": "string",
            "description": "One line, neutral words only, for example Person carrying a box through the loading dock"
          },
          "evidence": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Evidence"
            }
          },
          "zone": {
            "type": [
              "string",
              "null"
            ],
            "description": "Name of the zone involved, or null"
          },
          "whyMatched": {
            "type": "string",
            "description": "Two or three plain sentences explaining the match"
          },
          "keyFrames": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/KeyFrame"
            }
          },
          "thumbnailUrl": {
            "type": [
              "string",
              "null"
            ]
          },
          "snapshotUrl": {
            "type": [
              "string",
              "null"
            ],
            "description": "URL of the evidence snapshot (GET /api/clips/{id}/snapshot), or null when none was made. Only clips found from stored object tracks can have one."
          },
          "posterUrl": {
            "type": [
              "string",
              "null"
            ],
            "description": "URL of a poster frame at the clip's first matched second (GET /api/recordings/{id}/poster?t=), or null when no footage is attached"
          }
        }
      },
      "SearchRequest": {
        "type": "object",
        "required": [
          "question",
          "day"
        ],
        "properties": {
          "question": {
            "type": "string",
            "minLength": 1,
            "maxLength": 300,
            "description": "Not blank after trimming"
          },
          "day": {
            "type": "string",
            "format": "date"
          },
          "camera": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[A-Za-z0-9_-]{1,64}$",
            "default": null,
            "description": "A camera id; null or left out searches every camera"
          }
        }
      },
      "SearchResponse": {
        "properties": {
          "question": {
            "type": "string",
            "title": "Question"
          },
          "day": {
            "type": "string",
            "format": "date",
            "title": "Day"
          },
          "clips": {
            "items": {
              "$ref": "#/components/schemas/Clip"
            },
            "type": "array",
            "title": "Clips"
          },
          "note": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Note"
          },
          "proofs": {
            "items": {
              "$ref": "#/components/schemas/ClipProof"
            },
            "type": "array",
            "title": "Proofs",
            "description": "Measured proof for clips found from stored object tracks, one per such clip; empty when every clip came from the demo keyword search"
          },
          "needsIndexing": {
            "items": {
              "$ref": "#/components/schemas/NeedsIndexing"
            },
            "type": "array",
            "title": "Needsindexing",
            "description": "Objects the question names that some searched ready recordings have no stored tracks for, each with the estimated cost of searching for it. Search itself never spends: POST /api/concepts does, once the user confirms. Empty when nothing is missing or this build cannot search for new objects"
          }
        },
        "type": "object",
        "required": [
          "question",
          "day",
          "clips",
          "note",
          "proofs",
          "needsIndexing"
        ],
        "title": "SearchResponse",
        "description": "The matching clips, earliest first, and what the answer left out."
      },
      "BoxPoint": {
        "type": "object",
        "required": [
          "frame",
          "x1",
          "y1",
          "x2",
          "y2"
        ],
        "properties": {
          "frame": {
            "type": "integer",
            "minimum": 0
          },
          "x1": {
            "type": "number"
          },
          "y1": {
            "type": "number"
          },
          "x2": {
            "type": "number"
          },
          "y2": {
            "type": "number"
          }
        }
      },
      "BoxTrack": {
        "type": "object",
        "required": [
          "trackId",
          "label",
          "role",
          "points"
        ],
        "properties": {
          "trackId": {
            "type": "integer",
            "minimum": 0
          },
          "label": {
            "type": "string",
            "description": "A neutral object noun, such as person or cardboard box"
          },
          "role": {
            "type": "string",
            "enum": [
              "person",
              "object"
            ],
            "description": "person for a person; object for anything else (drawn highlighted)"
          },
          "points": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BoxPoint"
            },
            "description": "Ordered by frame; frames without a point had no detection"
          }
        }
      },
      "RecordingBoxes": {
        "type": "object",
        "required": [
          "recordingId",
          "frameWidth",
          "frameHeight",
          "fps",
          "tracks"
        ],
        "properties": {
          "recordingId": {
            "type": "string"
          },
          "frameWidth": {
            "type": "number",
            "exclusiveMinimum": 0,
            "description": "Width in pixels of the frame the boxes are in"
          },
          "frameHeight": {
            "type": "number",
            "exclusiveMinimum": 0
          },
          "fps": {
            "type": "number",
            "exclusiveMinimum": 0,
            "description": "Frames per second of the analysed video: frame n is at n / fps seconds"
          },
          "tracks": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BoxTrack"
            }
          }
        }
      },
      "ProofMeasure": {
        "type": "object",
        "required": [
          "name",
          "value"
        ],
        "properties": {
          "name": {
            "type": "string",
            "description": "For example frames_together, motion_agreement, frames_inside or coverage"
          },
          "value": {
            "type": "number"
          }
        }
      },
      "ProofBox": {
        "type": "object",
        "required": [
          "frame",
          "trackId",
          "label",
          "x1",
          "y1",
          "x2",
          "y2"
        ],
        "properties": {
          "frame": {
            "type": "integer",
            "minimum": 0
          },
          "trackId": {
            "type": "integer",
            "minimum": 0
          },
          "label": {
            "type": "string",
            "description": "A neutral object noun, such as person or cardboard box"
          },
          "x1": {
            "type": "number"
          },
          "y1": {
            "type": "number"
          },
          "x2": {
            "type": "number"
          },
          "y2": {
            "type": "number"
          }
        }
      },
      "ClipProof": {
        "type": "object",
        "required": [
          "clipId",
          "relation",
          "startFrame",
          "endFrame",
          "startSeconds",
          "endSeconds",
          "trackIds",
          "trackLabels",
          "measures",
          "boxes"
        ],
        "properties": {
          "clipId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$",
            "description": "The clip in clips this proves"
          },
          "relation": {
            "type": "string",
            "enum": [
              "carrying",
              "in_zone",
              "dwell"
            ]
          },
          "startFrame": {
            "type": "integer",
            "minimum": 0
          },
          "endFrame": {
            "type": "integer",
            "minimum": 0,
            "description": "Inclusive"
          },
          "startSeconds": {
            "type": "number",
            "minimum": 0,
            "description": "Seconds from the start of the recording"
          },
          "endSeconds": {
            "type": "number",
            "minimum": 0,
            "description": "End of the last frame, in the same unit"
          },
          "trackIds": {
            "type": "array",
            "items": {
              "type": "integer"
            },
            "description": "Track ids used, such as [person, box]"
          },
          "trackLabels": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "The label of each track, in the same order"
          },
          "measures": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ProofMeasure"
            }
          },
          "boxes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ProofBox"
            },
            "description": "First, middle and last box of each track"
          }
        }
      },
      "Point": {
        "type": "array",
        "description": "[x, y] as fractions of the frame's width and height, from the top-left corner",
        "minItems": 2,
        "maxItems": 2,
        "items": {
          "type": "number",
          "minimum": 0,
          "maximum": 1
        }
      },
      "Zone": {
        "type": "object",
        "required": [
          "id",
          "camera",
          "name",
          "points"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "camera": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$",
            "description": "The id of the camera the zone is drawn on"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60
          },
          "points": {
            "type": "array",
            "minItems": 3,
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/Point"
            }
          }
        }
      },
      "ZoneCreate": {
        "type": "object",
        "required": [
          "camera",
          "name",
          "points"
        ],
        "properties": {
          "camera": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$",
            "description": "The id of the camera to draw on (404 if unknown)"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60,
            "description": "Not blank after trimming; unique per camera, ignoring case (409 zone_name_taken)"
          },
          "points": {
            "type": "array",
            "minItems": 3,
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/Point"
            }
          }
        }
      },
      "ZoneUpdate": {
        "type": "object",
        "required": [
          "name",
          "points"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60,
            "description": "Not blank after trimming; unique per camera, ignoring case (409 zone_name_taken); a zone may change the case of its own name"
          },
          "points": {
            "type": "array",
            "minItems": 3,
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/Point"
            }
          }
        }
      },
      "SavedClip": {
        "type": "object",
        "required": [
          "id",
          "clip",
          "note",
          "savedAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "clip": {
            "$ref": "#/components/schemas/Clip"
          },
          "note": {
            "type": "string",
            "maxLength": 500
          },
          "savedAt": {
            "type": "string",
            "format": "date-time",
            "description": "UTC, ending in Z"
          }
        }
      },
      "SavedClipCreate": {
        "type": "object",
        "required": [
          "clipId"
        ],
        "properties": {
          "clipId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,64}$"
          },
          "note": {
            "type": "string",
            "maxLength": 500,
            "default": ""
          }
        }
      },
      "SavedClipUpdate": {
        "type": "object",
        "required": [
          "note"
        ],
        "properties": {
          "note": {
            "type": "string",
            "maxLength": 500
          }
        }
      },
      "ConceptJob": {
        "properties": {
          "noun": {
            "type": "string",
            "title": "Noun",
            "description": "The object, in its one spelling"
          },
          "state": {
            "type": "string",
            "enum": [
              "queued",
              "running",
              "done",
              "failed"
            ],
            "title": "State",
            "description": "queued, then running, then done or failed. A failed pass can be asked for again"
          },
          "recordingIds": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Recordingids",
            "description": "The recordings the pass covers"
          },
          "estimatedCostUsd": {
            "type": "number",
            "minimum": 0.0,
            "title": "Estimatedcostusd",
            "description": "US dollars the pass was estimated to cost when it was asked for"
          },
          "message": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Message",
            "description": "A fixed sentence saying why a failed pass failed; null in every other state"
          }
        },
        "type": "object",
        "required": [
          "noun",
          "state",
          "recordingIds",
          "estimatedCostUsd",
          "message"
        ],
        "title": "ConceptJob",
        "description": "One pass that searches recordings for one object."
      },
      "ConceptRequest": {
        "properties": {
          "noun": {
            "type": "string",
            "maxLength": 40,
            "minLength": 1,
            "title": "Noun",
            "description": "The object in plain English, such as forklift or traffic cone: letters, digits, spaces, hyphens and apostrophes; not blank after trimming; people are not objects to search for. Stored and returned in its one spelling (box becomes cardboard box)"
          },
          "confirm": {
            "type": "boolean",
            "const": true,
            "title": "Confirm",
            "description": "Must be true: the user accepts the estimated cost shown in needsIndexing"
          },
          "day": {
            "anyOf": [
              {
                "type": "string",
                "format": "date"
              },
              {
                "type": "null"
              }
            ],
            "title": "Day",
            "description": "Only the recordings of this day; leave it out for the 7 days ending today. Send the day of the search so the cost matches the estimate that was shown"
          },
          "camera": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,64}$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Camera",
            "description": "Only this camera's recordings; null or left out means all"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "noun",
          "confirm"
        ],
        "title": "ConceptRequest",
        "description": "Ask for one pass that searches the ready recordings that lack a new object."
      },
      "NeedsIndexing": {
        "properties": {
          "noun": {
            "type": "string",
            "title": "Noun",
            "description": "The object, in its one spelling (box is cardboard box)"
          },
          "estimatedCostUsd": {
            "type": "number",
            "minimum": 0.0,
            "title": "Estimatedcostusd",
            "description": "US dollars one pass over recordingIds is estimated to cost: 0.20 per 1,000 frames at 5 frames per second, at least 50 frames per recording"
          },
          "recordingIds": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Recordingids",
            "description": "The searched ready recordings that lack it"
          },
          "state": {
            "type": "string",
            "enum": [
              "not_indexed",
              "queued",
              "running"
            ],
            "title": "State",
            "description": "not_indexed: nothing asked yet; queued and running: a pass is on its way"
          }
        },
        "type": "object",
        "required": [
          "noun",
          "estimatedCostUsd",
          "recordingIds",
          "state"
        ],
        "title": "NeedsIndexing",
        "description": "An object the question names that some ready recordings have not been searched for."
      },
      "DemoCodeRequest": {
        "type": "object",
        "required": [
          "code"
        ],
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$",
            "title": "Code",
            "description": "The 6-digit demo access code, digits only"
          }
        }
      },
      "DemoCodeAccepted": {
        "type": "object",
        "required": [
          "ok"
        ],
        "properties": {
          "ok": {
            "type": "boolean",
            "const": true,
            "title": "Ok",
            "description": "Always true: the code is valid"
          }
        }
      }
    }
  }
}
